items:
  - q: "프로그램은 최소 몇 명부터 진행할 수 있나요?"
    a: "프로그램 유형마다 다르지만 일반적으로 10명 내외부터 설계가 가능합니다."
  - q: "실내와 수상 프로그램을 함께 진행할 수 있나요?"
    a: "가능합니다. 일정과 장소 조건에 맞춰 MIX 형태로 제안드립니다."
  - q: "행사형 부스 운영도 견적이 가능한가요?"
    a: "가능합니다. 인원, 시간, 지역에 따라 패키지별 운영안을 안내드립니다."
  - q: "문의 후 답변은 얼마나 걸리나요?"
    a: "평일 접수 기준으로 24시간 이내 회신을 원칙으로 운영합니다."
